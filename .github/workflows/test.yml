name: Model Performance Tests

on:
  push:
    branches: [ "master", "branch2-glm" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create test reports directory
      run: mkdir -p test_reports
      
    - name: Run model loading tests
      run: |
        pytest tests/test_model_loading.py -v \
          --html=test_reports/test_model_loading.html \
          --self-contained-html \
          --junitxml=test_reports/junit_model_loading.xml \
          --tb=short
      env:
        MODELS_DIR: .
        VALIDATION_DATA_DIR: ./hymenoptera_data/train
        
    - name: Run inference latency tests
      run: |
        pytest tests/test_inference_latency.py -v \
          --html=test_reports/test_latency.html \
          --self-contained-html \
          --junitxml=test_reports/junit_latency.xml \
          --tb=short
      env:
        MODELS_DIR: .
        VALIDATION_DATA_DIR: ./hymenoptera_data/train
        
    - name: Run accuracy tests
      run: |
        pytest tests/test_accuracy.py -v \
          --html=test_reports/test_accuracy.html \
          --self-contained-html \
          --junitxml=test_reports/junit_accuracy.xml \
          --tb=short
      env:
        MODELS_DIR: .
        VALIDATION_DATA_DIR: ./hymenoptera_data/train
        
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: test_reports/
        retention-days: 30
        
    - name: Test summary
      run: |
        echo "=========================================="
        echo "Test execution completed!"
        echo "Download test reports from the Artifacts section"
        echo "=========================================="

  docker-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Build Docker test image
      run: docker build -f dockerfile.test -t onnx-test .
      
    - name: Run tests in Docker container
      run: |
        docker run --rm \
          -v ${{ github.workspace }}/test_reports:/code/test_reports \
          -e MODELS_DIR=/code \
          -e VALIDATION_DATA_DIR=/code/hymenoptera_data/train \
          onnx-test \
          pytest tests/ -v \
            --html=/code/test_reports/test_report.html \
            --self-contained-html \
            --junitxml=/code/test_reports/junit_report.xml \
            --tb=short \
            --durations=10
            
    - name: Upload Docker test reports
      uses: actions/upload-artifact@v4
      with:
        name: docker-test-reports
        path: test_reports/
        retention-days: 30
